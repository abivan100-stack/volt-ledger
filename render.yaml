services:
  - type: web
    name: volt-api
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build:api
    startCommand: node server/dist/api.js
    healthCheckPath: /health
    envVars:
      - fromGroup: volt-production-runtime
      - key: MONGODB_URI
        sync: false
      - key: VOLT_DNS_SERVERS
        sync: false
      - key: TRUST_PROXY
        value: "true"
      - key: WEB_ORIGIN
        sync: false
      - key: BETTER_AUTH_SECRET
        sync: false
      - key: BETTER_AUTH_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false

  - type: worker
    name: volt-worker
    runtime: node
    plan: starter
    buildCommand: npm ci --include=dev && npm run build:api
    startCommand: node server/dist/worker.js
    envVars:
      - fromGroup: volt-production-runtime
      - key: MONGODB_URI
        sync: false
      - key: VOLT_DNS_SERVERS
        sync: false
      - key: WEB_ORIGIN
        sync: false
      - key: BETTER_AUTH_SECRET
        sync: false
      - key: BETTER_AUTH_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: WORKER_ID
        value: volt-worker-production

  - type: web
    name: volt-web
    runtime: static
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false

envVarGroups:
  - name: volt-production-runtime
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_DB_NAME
        value: volt
      - key: SIMULATION_DAILY_RUN_LIMIT
        value: "100"
      - key: SIMULATION_MAX_ATTEMPTS
        value: "5"
      # Public browser-demo persistence. Needs a replica set — every demo write
      # spans several collections that must agree, so against a standalone
      # server the routes answer 503 and the demo runs without storing.
      - key: DEMO_PERSISTENCE_ENABLED
        value: "true"
      - key: DEMO_RETENTION_DAYS
        value: "30"
