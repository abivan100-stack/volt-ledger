<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="volt-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="volt-border" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D333F"/>
      <stop offset="100%" stop-color="#1F232B"/>
    </linearGradient>
  </defs>

  <!-- Background tile with subtle dark ledger border -->
  <rect width="64" height="64" rx="14" fill="#0E1015"/>
  <rect x="1" y="1" width="62" height="62" rx="13" fill="none" stroke="url(#volt-border)" stroke-width="1.5"/>

  <!-- Crisp, iconic geometric lightning bolt -->
  <path
    d="M36.5 9 L18 34.5 H31.5 L27.5 55 L46 29.5 H32.5 Z"
    fill="url(#volt-amber)"
    stroke="#FBBF24"
    stroke-width="0.5"
