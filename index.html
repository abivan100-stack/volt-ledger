<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Volt — A transparent, tamper-evident ledger for peer-to-peer rooftop-solar energy trading. Built for the Open Energy Challenge 2026." />
    <meta name="theme-color" content="#F2EEE4" />

    <script>
      // Light is Volt's default: apply the stored preference before first paint
      // so the ledger never flashes dark while the bundle loads.
      (function () {
        try {
          var stored = window.localStorage.getItem('volt-theme')
          if (stored === 'system') return
          document.documentElement.dataset.theme = stored === 'dark' ? 'dark' : 'light'
        } catch (error) {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>

    <meta property="og:title" content="Volt — Local Energy Ledger" />
    <meta property="og:description" content="A transparent, tamper-evident ledger for peer-to-peer rooftop-solar energy trading." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og.svg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Volt — Local Energy Ledger" />
    <meta name="twitter:description" content="A transparent, tamper-evident ledger for peer-to-peer rooftop-solar energy trading." />
    <meta name="twitter:image" content="/og.svg" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Volt — Local Energy Ledger</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
